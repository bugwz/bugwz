name: Generate Profile Metrics

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-assets-release
  cancel-in-progress: false

jobs:
  generate-profile-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile overview
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          output_action: none
          base: header, repositories
          plugin_lines: yes
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate PageSpeed report
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.pagespeed.svg
          output_action: none
          token: NOT_NEEDED
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_url: https://bugwz.com
          plugin_pagespeed_detailed: false
          plugin_pagespeed_screenshot: false
          plugin_pagespeed_pwa: false

      - name: Generate starred topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.topics.icons.svg
          output_action: none
          token: NOT_NEEDED
          base: ""
          plugin_topics_sort: stars
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons

      - name: Generate star lists
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.starlists.svg
          output_action: none
          token: NOT_NEEDED
          base: ""
          plugin_starlists: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 8

      - name: Generate website screenshot
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.screenshot.svg
          output_action: none
          token: NOT_NEEDED
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: https://bugwz.com
          plugin_screenshot_url: https://bugwz.com
          plugin_screenshot_selector: "#body-wrap"
          plugin_screenshot_mode: image
          plugin_screenshot_viewport: '{"width": 1280,"height": 600}'

      - name: Ensure profile assets release exists
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view profile-assets >/dev/null 2>&1 || \
            gh release create profile-assets \
              --target "${GITHUB_SHA}" \
              --title "Profile Assets" \
              --notes "Automatically generated profile assets." \
              --latest=false

      - name: Publish profile metrics
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload profile-assets \
            /metrics_renders/github-metrics.svg \
            /metrics_renders/metrics.plugin.pagespeed.svg \
            /metrics_renders/metrics.plugin.topics.icons.svg \
            /metrics_renders/metrics.plugin.starlists.svg \
            /metrics_renders/metrics.plugin.screenshot.svg \
            --clobber
