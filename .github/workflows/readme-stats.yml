name: Generate README Stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-stats.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets-release
  cancel-in-progress: false

jobs:
  generate-readme-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Ensure profile assets release exists
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view profile-assets >/dev/null 2>&1 || \
            gh release create profile-assets \
              --target "${GITHUB_SHA}" \
              --title "Profile Assets" \
              --notes "Automatically generated profile assets." \
              --latest=false

      - name: Publish stats card
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload profile-assets stats.svg --clobber
