name: Generate README Stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-stats.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-readme-stats
  cancel-in-progress: true

jobs:
  generate-readme-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: assets/readme-stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme-stats/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub README stats"
          git push
